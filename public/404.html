<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة غير موجودة (404) — مشويات الحارة</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f3e9;
      color: #18221d;
      font-family: 'Cairo', system-ui, sans-serif;
      padding: 24px;
    "
  >
    <main
      style="
        max-width: 480px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e5e0d5;
        border-radius: 24px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(16, 75, 52, 0.08);
      "
    >
      <div
        style="
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 72px;
          height: 72px;
          border-radius: 18px;
          background: #104b34;
          color: #ffffff;
          font-size: 28px;
          font-weight: 800;
          margin-bottom: 18px;
        "
      >
        404
      </div>
      <h1 style="margin: 0 0 10px; font-size: 24px; font-weight: 800; color: #104b34">
        الصفحة غير موجودة
      </h1>
      <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.8; color: #4a5850">
        عذراً، الرابط الذي تحاول زيارته غير متاح أو تم نقله. يمكنك العودة إلى الصفحة الرئيسية
        أو تصفح المنيو.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap">
        <a
          href="/"
          style="
            background: #104b34;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
          "
        >
          العودة للرئيسية
        </a>
        <a
          href="/menu"
          style="
            background: #f7f3e9;
            color: #104b34;
            border: 1px solid #104b34;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
          "
        >
          تصفح المنيو
        </a>
      </div>
    </main>
  </body>
</html>
