name: Validate and Deploy Restaurant Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Unit & Worker Tests (Vitest)
        run: npx vitest run
      - name: API & Security E2E + Concurrency Tests
        run: npx tsx tests/e2e.test.ts && npx tsx tests/integration-concurrency.test.ts
      - name: Build Frontend
        run: npm run build
      - name: Verify Cloudflare Worker Bundle
        run: npx esbuild src/worker.ts --bundle --format=esm --platform=browser --main-fields=module,main --conditions=workerd,worker,browser --external:node:* --external:crypto --outfile=/tmp/worker-check.js && rm -f /tmp/worker-check.js
      - name: Audit Production Dependencies
        run: npm i --package-lock-only --ignore-scripts && npm audit --omit=dev --audit-level=high && rm -f package-lock.json

  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
